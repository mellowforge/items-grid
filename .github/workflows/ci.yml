name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, build, lint, test, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Build packages and apps
        run: pnpm build

      # The deployed site (landing page + demos under /items-grid/): catches base-path breakage on
      # pull requests, before a merge lets pages.yml deploy it.
      - name: Build the Pages site
        run: pnpm build:pages

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Agent hook tests
        run: pnpm test:hooks

      - name: Inspect package contents
        # Also checks that each tarball's LICENSE is byte-identical to the root LICENSE.
        run: pnpm pack:check
